name: Tests (Asan)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure AVX2 ASan preset
      run: cmake --preset asan

    - name: Build Project
      run: cmake --build --preset asan --parallel 4

    - name: Run tests
      run: ctest --preset asan

  build-optimized-profiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [x86-64-v3, avx512-full]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CPU profile
      run: cmake --preset "${{ matrix.profile }}"

    - name: Compile ISA-sensitive test targets
      run: >-
        cmake --build --preset "${{ matrix.profile }}" --parallel 4
        --target bit_algorithms_unittests rank_select_tests
        select512_experimental_tests wavelet_tree_tests
