name: coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    name: ${{ matrix.variant == 'native' && 'coverage' || 'coverage (SSE2)' }}
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: native
            build_directory: coverage
          - variant: sse2
            build_directory: coverage-sse2

    steps:
    - uses: actions/checkout@v4

    - name: Create Build Directory
      run: mkdir build

    - name: Run coverage
      run: ./scripts/coverage_report.sh
      env:
        PIXIE_COVERAGE_VARIANT: ${{ matrix.variant }}
        PIXIE_COVERAGE_JOBS: "4"

    - name: Prepare gcov reports for Codecov
      working-directory: build/${{ matrix.build_directory }}
      run: |
        cp -R gcov gcov-upload
        # Codecov skips numeric hits marked with gcov's partial-block '*'.
        # Normalize only the count field; keep branch records and raw artifacts.
        find gcov-upload -type f -name '*.gcov' -exec sed -i -E 's/^([[:blank:]]*[0-9]+)\*:([[:blank:]]*[0-9]+:)/\1:\2/' {} +

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: build/${{ matrix.build_directory }}/gcov-upload
        # Reports are already generated per translation unit; do not regenerate
        # them through the uploader's automatic gcov plugin.
        plugins: noop
        flags: gcov
        fail_ci_if_error: false

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-gcov-${{ matrix.variant }}
        path: |
          build/${{ matrix.build_directory }}/coverage.txt
          build/${{ matrix.build_directory }}/gcov/**/*.gcov
